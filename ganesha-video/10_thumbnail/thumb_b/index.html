<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>Thumbnail B</title>
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="kit.css" />
<script src="kit.js"></script>
<style>
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #8FD3F4; }
  #bg { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; object-fit: cover; filter: saturate(1.12) contrast(1.04); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,60,120,.0) 40%, rgba(60,20,10,.38) 100%); }
  #ganesha { position: absolute; right: -10px; bottom: -40px; height: 560px; filter: drop-shadow(0 18px 22px rgba(60,20,10,.5)); }
  .t1 { position: absolute; left: 40px; bottom: 214px; font-size: 128px; transform: rotate(-3deg); transform-origin: left bottom; white-space: nowrap; }
  .t2 { position: absolute; left: 34px; bottom: 56px; font-size: 168px; transform: rotate(-3deg); transform-origin: left bottom; white-space: nowrap; }
  #fx { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="thumb-b" data-start="0" data-width="1280" data-height="720" data-duration="1">
  <img id="bg" src="img/bg13.png" />
  <div class="shade"></div>
  <img id="ganesha" src="img/ganesha.png" />
  <div class="t1 display">WHO WILL</div>
  <div class="t2 display gold">WIN?</div>
  <div id="fx"></div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  Kit.sparkBurst(tl, '#fx', { x: 330, y: 120, at: 0, n: 8, seed: 4, r: 70, size: 46 });
  window.__timelines['thumb-b'] = tl;
</script>
</body>
</html>
