<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>Thumbnail A</title>
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="kit.css" />
<script src="kit.js"></script>
<style>
  #root { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 72% 48%, #FFF1B8 0%, #FFD866 22%, #F6B21A 46%, #F28C28 72%, #D63B2F 100%); }
  .rays { position: absolute; left: 72%; top: 48%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.20) 0deg 7deg, rgba(255,255,255,0) 7deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 38%, transparent 70%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 38%, transparent 70%); }
  .bunting { position: absolute; left: 0; top: 0; width: 1280px; height: 120px; }
  #ganesha { position: absolute; right: -34px; bottom: -34px; height: 700px; filter: drop-shadow(0 22px 26px rgba(80,18,8,.45)); }
  #mooshak { position: absolute; left: 18px; bottom: 64px; height: 330px; transform: rotate(-7deg); filter: drop-shadow(0 14px 16px rgba(80,18,8,.45)); }
  .t1 { position: absolute; left: 42px; top: 70px; font-size: 104px; transform: rotate(-3deg); transform-origin: left bottom; }
  .t2 { position: absolute; left: 36px; top: 158px; font-size: 150px; transform: rotate(-3deg); transform-origin: left bottom; white-space: nowrap; }
  .garland { position: absolute; left: 0; bottom: -18px; width: 1280px; height: 120px; }
  #fx { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="thumb-a" data-start="0" data-width="1280" data-height="720" data-duration="1">
  <div class="rays"></div>
  <svg class="bunting" viewBox="0 0 1280 120" id="bunting"></svg>
  <img id="ganesha" src="img/ganesha.png" />
  <div class="t1 display">GANESHA'S</div>
  <div class="t2 display gold">BIG RACE!</div>
  <img id="mooshak" src="img/mooshak_front_trim.png" />
  <div class="garland" id="garland"></div>
  <div id="fx"></div>
</div>
<script>
  // bunting flags across the top (race / festival feel)
  const cols = ['#D63B2F', '#F6B21A', '#1AA6A0', '#F4A6B8', '#8CCB6B', '#F28C28'];
  let b = '<path d="M0 8 Q640 70 1280 8" stroke="#7A1F16" stroke-width="5" fill="none"/>';
  for (let i = 0; i < 17; i++) {
    const x = 20 + i * 76, t = x / 1280, y = 8 + 4 * (1 - (2 * t - 1) ** 2) * 15.5;
    b += `<path d="M${x - 26} ${y + 2} L${x + 26} ${y + 2} L${x} ${y + 62} Z" fill="${cols[i % cols.length]}" stroke="#7A1F16" stroke-width="3" stroke-linejoin="round"/>`;
  }
  document.getElementById('bunting').innerHTML = b;
  // marigold garland along the bottom
  let g = '';
  for (let i = 0; i < 14; i++) g += `<div style="position:absolute;left:${i * 100 - 30}px;top:${(i % 2) * 14}px">${Kit.svg.marigold(112)}</div>`;
  document.getElementById('garland').innerHTML = g;
  const tl = gsap.timeline({ paused: true });
  Kit.sparkBurst(tl, '#fx', { x: 600, y: 300, at: 0, n: 7, seed: 11, r: 70, size: 46 });
  tl.set('#fx div', { opacity: 0.95 }, 0.2);
  window.__timelines['thumb-a'] = tl;
</script>
</body>
</html>
