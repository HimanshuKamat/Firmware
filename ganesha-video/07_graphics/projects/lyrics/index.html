<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Sing-Along Lyrics</title>
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="kit.css" />
<script src="kit.js"></script>
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }

  /* ------------------------------------------------------------------
     Placement (checked on the real frames of shots 31 and 32):
     one soft pill in the bottom band, outer edge at y 980 (the 6 px base strip ends on the 96 px line).
       - shot 31 (close-up): no face reaches below y ~850 (the mouse's chin is the lowest), so the
         pill (top y 862) only covers legs, feet and floor;
       - shot 32 (wide): faces stay far above; feet end at about y 830-850 (the pill top is 840) and only
         during the last half second, as the group steps forward, do a few toes dip behind the fading pill.
     ------------------------------------------------------------------ */
  .line {
    position: absolute; left: 0; right: 0; bottom: 100px;
    display: flex; justify-content: center; align-items: flex-end;
    opacity: 0; transform-origin: 50% 100%;
  }
  .pill {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; white-space: nowrap;
    border: 6px solid rgba(255, 216, 102, 0.92);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(204, 60, 46, 0.76) 0%, rgba(128, 29, 21, 0.82) 100%);
    box-shadow: 0 6px 0 rgba(88, 16, 10, 0.34), 0 16px 30px rgba(70, 14, 8, 0.34), inset 0 3px 0 rgba(255, 236, 190, 0.28);
  }
  /* verse lines (shot 31): 80 px type on a 118 px pill */
  .sm .pill { height: 118px; padding: 0 36px; gap: 22px; font-size: 80px; }
  .sm .fl   { width: 74px; height: 74px; }
  /* chant lines (shot 32): 100 px type on a 140 px pill */
  .lg .pill { height: 140px; padding: 0 40px; gap: 26px; font-size: 100px; }
  .lg .fl   { width: 90px; height: 90px; }

  .fl { position: relative; flex: none; display: block; }
  .fl svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .words { position: relative; display: flex; align-items: center; justify-content: center; padding-bottom: 0.12em; }
  .t { position: relative; display: block; }
  .w {
    position: relative; display: block; margin: 0 0.14em;
    color: var(--cream); will-change: transform;
  }
  /* soft glow bubble behind the word that is being sung */
  .hl {
    position: absolute; left: -0.14em; right: -0.14em; top: -0.02em; bottom: -0.04em; opacity: 0;
    border-radius: 0.5em;
    background: radial-gradient(closest-side, rgba(255, 226, 140, 0.62) 0%, rgba(255, 210, 110, 0.34) 62%, rgba(255, 210, 110, 0) 100%);
  }
  /* "Morya!" gets a little more room because it grows */
  .mwrap { position: relative; display: block; margin: 0 0.3em 0 0.34em; }
  .mwrap .w { margin: 0 0.1em; }
  .sparks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .spk { position: absolute; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="lyrics" data-start="0" data-width="1920" data-height="1080" data-duration="13">

  <div id="line0" class="line sm"><div class="pill"><span class="fl fl-l" data-layout-allow-overflow></span>
    <div class="words display">
      <span class="w" id="w0_0"><i class="hl"></i><span class="t">Hold</span></span>
      <span class="w" id="w0_1"><i class="hl"></i><span class="t">your</span></span>
      <span class="w" id="w0_2"><i class="hl"></i><span class="t">family,</span></span>
      <span class="w" id="w0_3"><i class="hl"></i><span class="t">hold</span></span>
      <span class="w" id="w0_4"><i class="hl"></i><span class="t">them</span></span>
      <span class="w" id="w0_5"><i class="hl"></i><span class="t">near,</span></span>
    </div><span class="fl fl-r" data-layout-allow-overflow></span></div></div>

  <div id="line1" class="line sm"><div class="pill"><span class="fl fl-l" data-layout-allow-overflow></span>
    <div class="words display">
      <span class="w" id="w1_0"><i class="hl"></i><span class="t">They</span></span>
      <span class="w" id="w1_1"><i class="hl"></i><span class="t">are</span></span>
      <span class="w" id="w1_2"><i class="hl"></i><span class="t">your</span></span>
      <span class="w" id="w1_3"><i class="hl"></i><span class="t">whole</span></span>
      <span class="w" id="w1_4"><i class="hl"></i><span class="t">world,</span></span>
      <span class="w" id="w1_5"><i class="hl"></i><span class="t">dear!</span></span>
    </div><span class="fl fl-r" data-layout-allow-overflow></span></div></div>

  <div id="line2" class="line lg"><div class="pill"><span class="fl fl-l" data-layout-allow-overflow></span>
    <div class="words display">
      <span class="w" id="w2_0"><i class="hl"></i><span class="t">Ganpati</span></span>
      <span class="w" id="w2_1"><i class="hl"></i><span class="t">Bappa...</span></span>
      <span class="mwrap" data-layout-allow-overflow><span class="w" id="w2_2"><i class="hl"></i><span class="t">Morya!</span></span><span class="sparks" id="sp2"></span></span>
    </div><span class="fl fl-r" data-layout-allow-overflow></span></div></div>

  <div id="line3" class="line lg"><div class="pill"><span class="fl fl-l" data-layout-allow-overflow></span>
    <div class="words display">
      <span class="w" id="w3_0"><i class="hl"></i><span class="t">Ganpati</span></span>
      <span class="w" id="w3_1"><i class="hl"></i><span class="t">Bappa...</span></span>
      <span class="mwrap" data-layout-allow-overflow><span class="w" id="w3_2"><i class="hl"></i><span class="t">Morya!</span></span><span class="sparks" id="sp3"></span></span>
    </div><span class="fl fl-r" data-layout-allow-overflow></span></div></div>

</div>

<script>
  const tl = gsap.timeline({ paused: true });

  /* ---------- word timings: absolute no-intro seconds from timing.json (lines_abs_noIntro) ---------- */
  const START = 239.4;                       // overlay start on the no-intro timeline
  const LINES = [
    [["Hold", 240.0, 240.4], ["your", 240.46, 240.6], ["family,", 240.76, 241.36], ["hold", 241.5, 241.8], ["them", 241.9, 242.16], ["near.", 242.24, 242.62]],
    [["They", 243.0, 243.34], ["are", 243.48, 243.72], ["your", 243.8, 244.12], ["whole", 244.54, 244.84], ["world,", 244.9, 245.18], ["dear!", 245.3, 245.64]],
    [["Ganpati", 246.02, 246.68], ["Bappa", 246.76, 247.34], ["Morya!", 247.5, 248.5]],
    [["Ganpati", 249.02, 249.7], ["Bappa", 249.76, 250.4], ["Morya!", 250.54, 251.62]],
  ];
  const rel = (v) => Math.round((v - START) * 1000) / 1000;   // relative to the overlay's own start
  const GOLD = '#FFCB45';                                      // sung words (a touch warmer than --gold-light so cream -> gold reads on a phone)

  /* ---------- marigolds on the ends of every pill ---------- */
  document.querySelectorAll('.fl').forEach((el) => { el.innerHTML = Kit.svg.marigold(90); });

  /* ---------- each line: soft pop in, words light up one by one, soft hand-over to the next ---------- */
  LINES.forEach((words, li) => {
    const line = '#line' + li;
    const s = rel(words[0][1]), e = rel(words[words.length - 1][2]);
    const next = LINES[li + 1] ? rel(LINES[li + 1][0][1]) : null;

    // in: completes on the first word of the line (first line a touch slower)
    const inDur = li === 0 ? 0.3 : 0.25;
    const inAt = s - inDur;
    // out: begins just before the last word ends, finishes exactly where the next line starts to fade in (no overlap of two lines)
    const outDur = next === null ? 0.5 : 0.25;
    const outAt = next === null ? e + 0.08 : next - 0.5;
    tl.fromTo(line, { opacity: 0, y: 22, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: inDur, ease: 'power2.out' }, inAt);
    tl.to(line, { opacity: 0, y: -10, scale: 0.985, duration: outDur, ease: 'power1.inOut' }, outAt);

    // the two marigolds turn very slowly while the line is on screen
    tl.fromTo(line + ' .fl-l', { rotation: -24 }, { rotation: 36, duration: outAt + outDur - inAt, ease: 'none' }, inAt);
    tl.fromTo(line + ' .fl-r', { rotation: 24 }, { rotation: -36, duration: outAt + outDur - inAt, ease: 'none' }, inAt);

    words.forEach((w, wi) => {
      const el = '#w' + li + '_' + wi;
      const t0 = rel(w[1]), t1 = rel(w[2]);
      const isMorya = w[0] === 'Morya!';

      // cream -> gold as it is sung (stays gold so the line "fills up")
      tl.to(el, { color: GOLD, duration: 0.25, ease: 'power2.out' }, t0);
      // glow bubble behind the current word, softly in and out
      tl.fromTo(el + ' .hl', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power1.out', immediateRender: false }, t0);
      tl.to(el + ' .hl', { opacity: 0, duration: 0.3, ease: 'power1.inOut' }, Math.max(t1, t0 + 0.25) + 0.05);

      if (!isMorya) {
        // small lift and settle
        tl.fromTo(el, { y: 0, scale: 1, transformOrigin: '50% 85%' }, { y: -14, scale: 1.07, duration: 0.16, ease: 'power2.out', immediateRender: false }, t0);
        tl.to(el, { y: 0, scale: 1, duration: 0.34, ease: 'power2.inOut' }, t0 + 0.16);
      } else {
        // "Morya!": a bigger bounce, a little wiggle, then it stays a bit larger
        tl.fromTo(el, { y: 0, scale: 1, rotation: 0, transformOrigin: '50% 85%' }, { y: -14, scale: 1.26, rotation: -4, duration: 0.3, ease: 'power2.out', immediateRender: false }, t0);
        tl.to(el, { y: 0, scale: 1.1, rotation: 2.5, duration: 0.45, ease: 'back.out(1.8)' }, t0 + 0.3);
        tl.to(el, { rotation: -1, duration: 0.4, ease: 'sine.inOut' }, t0 + 0.75);
        // soft sparkle burst (upper arc only, small, eases out)
        const box = document.getElementById('sp' + li);
        const rnd = Kit.rng(41 + li * 7);
        const N = 9;
        for (let k = 0; k < N; k++) {
          const size = 26 + rnd() * 16;
          const sp = document.createElement('div');
          sp.className = 'spk'; sp.id = 'spk' + li + '_' + k;
          sp.style.cssText = `left:${-size / 2}px;top:${-size / 2}px;width:${size}px;height:${size}px`;
          sp.innerHTML = Kit.svg.sparkle(k % 2 ? '#FFF3DC' : '#FFD866', size);
          box.appendChild(sp);
          const ang = -Math.PI + Math.PI * ((k + 0.5) / N) + (rnd() - 0.5) * 0.25;   // from left, over the top, to right
          const dist = 120 + rnd() * 70;
          const dx = Math.cos(ang) * dist * 1.25, dy = Math.sin(ang) * dist * 0.85 - 18;
          const d0 = t0 + 0.06 + 0.03 * (k % 3);
          tl.fromTo(sp, { x: 0, y: 0, scale: 0.2, opacity: 0, rotation: 0 },
            { x: dx, y: dy, scale: 1, opacity: 1, rotation: 80, duration: 0.5, ease: 'power2.out' }, d0);
          tl.to(sp, { opacity: 0, scale: 0.3, duration: 0.55, ease: 'power1.in' }, d0 + 0.5);
        }
        // the marigolds give a little happy pulse on Morya
        tl.fromTo(line + ' .fl', { scale: 1 }, { scale: 1.1, duration: 0.3, ease: 'power2.out', immediateRender: false }, t0);
        tl.to(line + ' .fl', { scale: 1, duration: 0.5, ease: 'sine.inOut' }, t0 + 0.3);
      }
    });
  });

  window.__timelines['lyrics'] = tl;
</script>
</body>
</html>
