<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>End Screen</title>
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="kit.css" />
<script src="kit.js"></script>
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }

  /* ------------------------------------------------------------------------------------------------
     LAYOUT (all numbers are final-frame pixels; designed against the real shot 33 frames)
     The characters walk left as the camera pushes in: Mooshak's left ear reaches x ~780 (y 625+), Ganesha's left ear
     x ~1170 (y 400+) and his crown tip y ~250 (x 1285-1410). Everything below stays in the open left / upper-left zone.

       YouTube element rectangles (the exact rectangles the editor copies into the end-screen editor):
         video 1   x 108  y 108  w 480 h 270   (right 588, bottom 378)
         video 2   x 640  y 108  w 480 h 270   (right 1120, bottom 378)
         subscribe x 108  y 766  d 200         (circle, centre 208,866)
       The drawn frame is the rectangle grown by 12 px (8 px cream border + 4 px mat) so the live thumbnail seats
       neatly inside the cream border. Outer ring edge: x 90, y 90 (a hair inside the 96 px margin is only the
       6 px dark-red ring; the cream border itself starts at x 96 / y 96).
     ------------------------------------------------------------------------------------------------ */

  #back  { position: absolute; inset: 0; }                 /* petals + fireflies, behind everything */
  #petals { position: absolute; left: 0; top: 0; width: 600px; height: 1080px; }
  #frames { position: absolute; inset: 0; }
  #heads { position: absolute; inset: 0; }
  #front { position: absolute; inset: 0; }                 /* sparkles, in front of everything */

  /* ---------- video frames ---------- */
  .frame {
    position: absolute; top: 96px; width: 504px; height: 294px; box-sizing: border-box;
    border: 8px solid var(--cream); border-radius: 32px;
    background: linear-gradient(180deg, rgba(255, 243, 220, 0.34) 0%, rgba(246, 178, 26, 0.22) 100%);
    box-shadow: 0 0 0 6px rgba(122, 31, 22, 0.62), 0 8px 18px rgba(70, 14, 8, 0.26);
    opacity: 0; will-change: transform;
  }
  #f1 { left: 96px; }
  #f2 { left: 628px; }
  .glow {
    position: absolute; top: 96px; width: 504px; height: 294px; box-sizing: border-box; border-radius: 32px;
    box-shadow: 0 0 24px 6px rgba(255, 216, 102, 0.75); opacity: 0;
  }
  #g1 { left: 96px; }
  #g2 { left: 628px; }
  .frame .in { position: absolute; left: 4px; top: 4px; width: 480px; height: 270px; }   /* = the YouTube rectangle */

  .play { position: absolute; left: 186px; top: 24px; width: 108px; height: 108px; opacity: 0; will-change: transform; }
  .play svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 8px rgba(70, 14, 8, 0.35)); }

  .pillrow { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
  .pill {
    display: block; box-sizing: border-box; opacity: 0; will-change: transform; white-space: nowrap;
    padding: 2px 30px 8px; border: 6px solid var(--gold); border-radius: 999px;
    background: linear-gradient(180deg, #D8402F 0%, #C13024 52%, #A3231A 100%);
    box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.18), 0 5px 0 rgba(110, 22, 15, 0.55), 0 10px 16px rgba(70, 14, 8, 0.3);
    font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 64px; line-height: 1.04; letter-spacing: 0.012em;
    color: var(--gold-light); text-shadow: 0 3px 0 rgba(110, 22, 15, 0.7);
  }
  .frame .pillrow { top: 158px; }

  /* ---------- subscribe circle ---------- */
  .circ {
    position: absolute; left: 96px; top: 754px; width: 224px; height: 224px; box-sizing: border-box;
    border: 8px solid var(--cream); border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(255, 243, 220, 0.42) 0%, rgba(246, 178, 26, 0.24) 100%);
    box-shadow: 0 0 0 6px rgba(122, 31, 22, 0.62), 0 8px 18px rgba(70, 14, 8, 0.26);
    opacity: 0; will-change: transform;
  }
  .circ .in { position: absolute; left: 4px; top: 4px; width: 200px; height: 200px; border-radius: 50%; }   /* = the YouTube circle */
  #cglow { position: absolute; left: 96px; top: 754px; width: 224px; height: 224px; border-radius: 50%; box-sizing: border-box;
           box-shadow: 0 0 24px 6px rgba(255, 216, 102, 0.75); opacity: 0; }
  .bell { position: absolute; left: 48px; top: 40px; width: 104px; height: 104px; opacity: 0; will-change: transform; }
  .bell svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 5px 6px rgba(70, 14, 8, 0.35)); }
  #subrow { position: absolute; left: 350px; top: 818px; }
  #subrow .pill { transform-origin: 0% 50%; }

  /* ---------- headlines (same slot; the second replaces the first) ---------- */
  .lock { position: absolute; left: 112px; top: 430px; }
  .hl { font-size: 140px; line-height: 1; white-space: nowrap; }
  .hl .line { display: flex; align-items: baseline; gap: 0.28em; }
  .hl .w { display: block; opacity: 0; will-change: transform; }
  .fader { position: absolute; inset: 0; opacity: 1; }
  .rose { position: absolute; width: 92px; height: 92px; opacity: 0; will-change: transform; }
  .rose svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 8px rgba(70, 14, 8, 0.4)); }

  /* ---------- little lights ---------- */
  .ff { position: absolute; border-radius: 50%; opacity: 0; will-change: transform;
        background: radial-gradient(circle, #FFFCE8 0%, #FFE98A 30%, rgba(255, 214, 90, 0.55) 52%, rgba(255, 214, 90, 0) 72%); }
  .twk { position: absolute; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="end_screen" data-start="0" data-width="1920" data-height="1080" data-duration="20">

  <div id="back">
    <div id="petals" data-layout-allow-overflow data-layout-allow-orbit></div>
    <div id="flies"></div>
  </div>

  <div id="frames">
    <div id="g1" class="glow"></div>
    <div id="g2" class="glow"></div>
    <div id="cglow"></div>

    <div id="f1" class="frame"><div class="in">
      <div id="p1" class="play"></div>
      <div class="pillrow"><div id="l1" class="pill">Watch next</div></div>
    </div></div>

    <div id="f2" class="frame"><div class="in">
      <div id="p2" class="play"></div>
      <div class="pillrow"><div id="l2" class="pill">More stories</div></div>
    </div></div>

    <div id="c1" class="circ"><div class="in">
      <div id="bell" class="bell"></div>
    </div></div>
    <div id="subrow"><div id="l3" class="pill" data-layout-allow-overflow>Subscribe</div></div>
  </div>

  <div id="heads">
    <div id="fade1" class="fader">
      <div id="lock1" class="lock">
        <div class="hl display">
          <div class="line"><span id="a1" class="w">Thanks</span><span id="a2" class="w">for</span></div>
          <div class="line"><span id="a3" class="w" data-layout-allow-overlap>watching!</span></div>
        </div>
      </div>
      <div id="rose1" class="rose" style="left:862px;top:448px" data-layout-allow-overflow></div>
    </div>
    <div id="fade2" class="fader">
      <div id="lock2" class="lock">
        <div class="hl display">
          <div class="line"><span id="b1" class="w">See</span><span id="b2" class="w">you</span></div>
          <div class="line"><span id="b3" class="w" data-layout-allow-overlap>soon!</span></div>
        </div>
      </div>
      <div id="rose2" class="rose" style="left:672px;top:448px" data-layout-allow-overflow></div>
    </div>
  </div>

  <div id="front"></div>
</div>

<script>
  const tl = gsap.timeline({ paused: true });

  /* ---------- cues (seconds from the overlay start; end_screen in timing.json) ---------- */
  const CUE = { thanks_in: 0.6, thanks_out: 8.8, see_in: 9.4, see_out: 19.4, frames_in: 1.6, circle_in: 2.6, end: 20 };
  const FADE = 0.5;                       // soft exit; thanks fade ends 9.3, see-you fade ends 19.9

  /* ---------- build the little SVG pieces ---------- */
  const playSvg = `<svg viewBox="0 0 108 108"><circle cx="54" cy="54" r="48" fill="#D63B2F" stroke="#F6B21A" stroke-width="7"/>
      <ellipse cx="54" cy="34" rx="30" ry="14" fill="rgba(255,255,255,0.16)"/>
      <path d="M43 31 L43 77 Q43 81 47 79 L80 56.500 Q83 54 80 51.500 L47 29 Q43 27 43 31 Z" fill="#FFF3DC" stroke="#FFF3DC" stroke-width="6" stroke-linejoin="round"/></svg>`;
  document.getElementById('p1').innerHTML = playSvg;
  document.getElementById('p2').innerHTML = playSvg;

  document.getElementById('bell').innerHTML = `<svg viewBox="0 0 120 120">
      <defs><linearGradient id="bellg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#F6B21A"/></linearGradient></defs>
      <g stroke="#7A1F16" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <path d="M60 14 a8 8 0 0 1 8 8 v2 C86 29 96 45 96 65 v14 l11 15 c3 4 0 9 -5 9 H18 c-5 0 -8 -5 -5 -9 l11 -15 V65 C24 45 34 29 52 24 v-2 a8 8 0 0 1 8 -8 z" fill="url(#bellg)"/>
        <path d="M45 106 a15 15 0 0 0 30 0 z" fill="#F28C28"/>
      </g>
      <path d="M37 66 C37 51 45 41 56 37" stroke="rgba(255,255,255,0.7)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="95" cy="26" r="14" fill="#D63B2F" stroke="#FFF3DC" stroke-width="6"/>
    </svg>`;
  document.getElementById('rose1').innerHTML = Kit.svg.marigold(92);
  document.getElementById('rose2').innerHTML = Kit.svg.marigold(92);

  /* ---------- headline words pop one after another (first lands exactly on its cue) ---------- */
  function popWord(sel, at, tilt) {
    tl.fromTo(sel, { scale: 0.5, y: 30, rotation: tilt - 4, transformOrigin: '50% 70%' },
                   { scale: 1, y: 0, rotation: tilt, duration: 0.62, ease: 'back.out(1.3)' }, at);
    tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out', immediateRender: false }, at);
  }
  function popRose(sel, at, dir, rest) {
    tl.fromTo(sel, { scale: 0.2, rotation: -70 * dir, transformOrigin: '50% 50%' },
                   { scale: 1, rotation: 0, duration: 0.65, ease: 'back.out(1.8)' }, at);
    tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out', immediateRender: false }, at);
    tl.to(sel, { rotation: 18 * dir, duration: rest, ease: 'none' }, at + 0.65);   // very slow turn while it holds (finite)
  }

  /* "Thanks for watching!" */
  popWord('#a1', CUE.thanks_in, -2.5);
  popWord('#a2', CUE.thanks_in + 0.12, 1.6);
  popWord('#a3', CUE.thanks_in + 0.24, -2);
  popRose('#rose1', CUE.thanks_in + 0.45, 1, 6.5);
  Kit.sparkBurst(tl, '#front', { x: 770, y: 600, at: CUE.thanks_in + 0.75, n: 7, r: 70, size: 30, seed: 41 });
  tl.to('#lock1', { y: -5, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, CUE.thanks_in + 1.4);   // 2.0 -> 8.0, ends at rest
  tl.to('#fade1', { opacity: 0, y: -14, duration: FADE, ease: 'power1.inOut' }, CUE.thanks_out);

  /* "See you soon!" */
  popWord('#b1', CUE.see_in, -2.2);
  popWord('#b2', CUE.see_in + 0.12, 1.8);
  popWord('#b3', CUE.see_in + 0.26, -1.6);
  popRose('#rose2', CUE.see_in + 0.45, -1, 8.5);
  Kit.sparkBurst(tl, '#front', { x: 520, y: 610, at: CUE.see_in + 0.78, n: 7, r: 70, size: 30, seed: 53 });
  tl.to('#lock2', { y: -5, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 5 }, CUE.see_in + 1.0);   // 10.4 -> 19.4, ends at rest
  tl.to('#fade2', { opacity: 0, y: -14, duration: FADE, ease: 'power1.inOut' }, CUE.see_out);

  /* ---------- frames and circle ---------- */
  function popFrame(frame, glow, play, label, at) {
    tl.fromTo(frame, { scale: 0.86, y: 26, transformOrigin: '50% 50%' }, { scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.5)' }, at);
    tl.fromTo(frame, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out', immediateRender: false }, at);
    tl.fromTo(play, { scale: 0.2, opacity: 0, transformOrigin: '50% 50%' }, { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(2)' }, at + 0.3);
    tl.fromTo(label, { scale: 0.5, y: 14, opacity: 0, transformOrigin: '50% 60%' }, { scale: 1, y: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' }, at + 0.45);
    // soft golden halo breathes behind the frame (opacity only, 1.5 s per breath, never faster than that)
    tl.fromTo(glow, { opacity: 0 }, { opacity: 0.2, duration: 0.8, ease: 'sine.inOut', immediateRender: false }, at + 0.3);
  }
  popFrame('#f1', '#g1', '#p1', '#l1', CUE.frames_in);
  popFrame('#f2', '#g2', '#p2', '#l2', CUE.frames_in + 0.2);
  // circle
  tl.fromTo('#c1', { scale: 0.7, y: 20, transformOrigin: '50% 50%' }, { scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.7)' }, CUE.circle_in);
  tl.fromTo('#c1', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out', immediateRender: false }, CUE.circle_in);
  tl.fromTo('#bell', { scale: 0.2, opacity: 0, transformOrigin: '50% 12%' }, { scale: 1, opacity: 1, duration: 0.55, ease: 'back.out(2)' }, CUE.circle_in + 0.3);
  tl.fromTo('#l3', { scale: 0.5, x: -16, opacity: 0 }, { scale: 1, x: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' }, CUE.circle_in + 0.45);
  tl.fromTo('#cglow', { opacity: 0 }, { opacity: 0.2, duration: 0.8, ease: 'sine.inOut', immediateRender: false }, CUE.circle_in + 0.3);

  // the halos breathe gently for the rest of the shot (1.5 s per swing, 0.2 <-> 0.5 opacity, 10 swings, all done by 19.4 s)
  ['#g1', '#g2', '#cglow'].forEach((g, i) => {
    tl.to(g, { opacity: 0.5, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 9 }, 3.8 + i * 0.3);
  });

  // bell nods when it arrives and again as each farewell line arrives (soft, +-12 deg, finite)
  [CUE.circle_in + 0.9, CUE.see_in + 0.6, 15.0].forEach((t) => {
    tl.to('#bell', { rotation: 12, duration: 0.24, ease: 'sine.inOut', yoyo: true, repeat: 5 }, t);
  });
  // play buttons give one soft breath each, staggered (scale only)
  [['#p1', 5.2], ['#p2', 5.6], ['#p1', 12.0], ['#p2', 12.4]].forEach(([p, t]) => {
    tl.to(p, { scale: 1.08, duration: 0.7, ease: 'sine.inOut', yoyo: true, repeat: 1 }, t);
  });

  // sparkle burst as the frames land
  Kit.sparkBurst(tl, '#front', { x: 614, y: 250, at: CUE.frames_in + 0.45, n: 8, r: 64, size: 30, seed: 17 });
  Kit.sparkBurst(tl, '#front', { x: 300, y: 770, at: CUE.circle_in + 0.5, n: 7, r: 58, size: 28, seed: 29 });

  /* ---------- the held background: slow petals + twinkles + fireflies (all seeded, all finite) ---------- */
  /* petals: position + fade (outer) > slow spin (mid) > side-to-side flutter (inner); stay in the left strip, clear of both characters */
  (function petals(n, seed) {
    const rnd = Kit.rng(seed), host = document.getElementById('petals');
    const cols = ['#F6B21A', '#F28C28', '#F4A6B8', '#FFD866'];
    for (let i = 0; i < n; i++) {
      const outer = document.createElement('div');
      outer.id = 'pt' + i;
      outer.style.cssText = 'position:absolute;left:0;top:0;opacity:0;will-change:transform';
      const mid = document.createElement('div'); mid.id = 'ptm' + i;
      const inner = document.createElement('div'); inner.id = 'pti' + i;
      const size = 24 + rnd() * 18, flower = rnd() < 0.18;
      inner.innerHTML = flower ? Kit.svg.marigold(size * 1.15) : Kit.svg.petal(cols[Math.floor(rnd() * cols.length)], size * 0.62, size);
      mid.appendChild(inner); outer.appendChild(mid); host.appendChild(outer);
      const x0 = 30 + rnd() * 560, dx = (rnd() - 0.5) * 160, d = 7.5 + rnd() * 1.5;
      const t0 = 4.5 + (i / (n - 1)) * 6.5 + (rnd() - 0.5) * 0.5, r0 = rnd() * 360, spin = (rnd() - 0.5) * 420;
      tl.fromTo(outer, { x: x0, y: -80 }, { x: x0 + dx, y: 1100, duration: d, ease: 'none' }, t0);
      tl.fromTo(mid, { rotation: r0, transformOrigin: '50% 50%' }, { rotation: r0 + spin, duration: d, ease: 'none' }, t0);
      tl.to(outer, { opacity: 0.92, duration: 0.6, ease: 'none' }, t0);
      tl.to(outer, { opacity: 0, duration: 0.7, ease: 'none' }, t0 + d - 0.7);
      const sw = 14 + rnd() * 20, per = 1.5 + rnd() * 1.2, reps = Math.max(1, Math.floor(d / per) - 1);
      tl.fromTo(inner, { x: -sw, rotationY: -35 }, { x: sw, rotationY: 35, duration: per, ease: 'sine.inOut', yoyo: true, repeat: reps }, t0);
    }
  })(12, 77);

  const flies = document.getElementById('flies');
  const rf = Kit.rng(5);
  const fl = [   // x, y, size, appear, life, dx, dy
    [690, 410, 34, 3.0, 7.0, 40, -36], [1180, 120, 30, 4.2, 7.5, 26, 34], [740, 760, 30, 5.0, 7.0, -30, -40],
    [420, 440, 26, 8.4, 7.0, 36, 24], [660, 960, 30, 10.0, 7.5, 40, -30], [1150, 300, 26, 11.2, 7.0, -20, 36],
    [800, 520, 28, 13.0, 6.5, -34, -30],
  ];
  fl.forEach(([x, y, s, at, life, dx, dy], i) => {
    const d = document.createElement('div');
    d.className = 'ff'; d.id = 'ff' + i;
    d.style.cssText = `left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px`;
    flies.appendChild(d);
    tl.fromTo(d, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, duration: 1.4, ease: 'sine.inOut' }, at);
    tl.to(d, { x: dx, y: dy, duration: life, ease: 'sine.inOut' }, at);
    tl.to(d, { opacity: 0, duration: 1.4, ease: 'sine.inOut' }, at + life - 1.4);
  });

  const front = document.getElementById('front');
  const tw = [   // x, y, size, appear
    [1160, 70, 38, 3.4], [622, 424, 30, 5.2], [352, 700, 34, 6.4], [90, 436, 28, 7.6],
    [1010, 410, 34, 10.6], [700, 820, 30, 12.2], [370, 410, 30, 13.8], [1190, 230, 32, 15.4], [640, 690, 36, 17.0],
  ];
  tw.forEach(([x, y, s, at], i) => {
    const d = document.createElement('div');
    d.className = 'twk'; d.id = 'twk' + i;
    d.style.cssText = `left:${x - s / 2}px;top:${y - s / 2}px;width:${s}px;height:${s}px`;
    d.innerHTML = Kit.svg.sparkle(i % 2 ? '#FFF3DC' : '#FFD866', s);
    front.appendChild(d);
    tl.fromTo(d, { opacity: 0, scale: 0.35, rotation: 0 }, { opacity: 0.9, scale: 1, rotation: 45, duration: 0.8, ease: 'sine.inOut' }, at);
    tl.to(d, { opacity: 0, scale: 0.35, rotation: 90, duration: 0.8, ease: 'sine.inOut' }, at + 0.8);
  });

  window.__timelines['end_screen'] = tl;
</script>
</body>
</html>
