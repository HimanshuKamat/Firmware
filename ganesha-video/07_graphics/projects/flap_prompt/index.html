<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Flap Prompt</title>
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="kit.css" />
<script src="kit.js"></script>
<style>
  @font-face { font-family: "Fredoka"; src: url("fonts/Fredoka.ttf") format("truetype"); font-weight: 300 700; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #fx { position: absolute; inset: 0; }

  /* =========================================================
     PART 1: the question card (right-hand column, rider stays clear)
     Layers: pExit (leave) > pFloat (slow bob) > pPop (pop-in) > card
     ========================================================= */
  #prompt { position: absolute; left: 1396px; top: 388px; width: 408px; }
  #pExit, #pFloat, #pPop { display: block; width: 408px; }
  #pPop { position: relative; }
  #card {
    position: relative; box-sizing: border-box; width: 408px;
    padding: 40px 14px 30px;
    text-align: center; white-space: nowrap;
    font-family: "Fredoka", sans-serif; color: var(--cream);
  }
  /* inner glossy highlight along the top of the card */
  #card::before {
    content: ""; position: absolute; left: 26px; right: 26px; top: 12px; height: 34px;
    border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
    pointer-events: none;
  }
  #card .ln { display: block; font-weight: 600; text-shadow: 0 4px 0 rgba(110, 22, 15, 0.7); }
  #card .l1 { font-size: 66px; line-height: 1.22; }
  #card .l3 { font-size: 66px; line-height: 1.22; }
  #card .l2w { display: block; width: 100%; }
  #card .l2 { display: inline-block; font-size: 138px; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em; color: var(--gold-light);
              text-shadow: 0 6px 0 rgba(110, 22, 15, 0.7), 0 12px 18px rgba(70, 14, 8, 0.35); }

  /* wings emblem sitting on the card's top rim */
  #wings { position: absolute; left: 14px; top: -148px; width: 380px; height: 170px; z-index: 3; }
  #wings .wing { position: absolute; left: 0; top: 0; width: 380px; height: 170px; }
  #wings .wing svg { display: block; width: 380px; height: 170px; overflow: visible; filter: drop-shadow(0 6px 6px rgba(70, 14, 8, 0.35)); }
  #wings #bloom { position: absolute; left: 154px; top: 100px; width: 72px; height: 72px; z-index: 2; }
  #wings #bloom svg { display: block; width: 72px; height: 72px; filter: drop-shadow(0 4px 5px rgba(70, 14, 8, 0.4)); }

  /* =========================================================
     PART 2: the three "Flap!" words (right / left / right)
     Layers: fader (final exit) > wpos (placement) > wfloat (idle bob) > wwig (wiggle) > wpop (pop) > text
     ========================================================= */
  #fader { position: absolute; inset: 0; }
  .wpos { position: absolute; width: 440px; height: 210px; }
  .wfloat, .wwig, .wpop, .wtilt { display: block; width: 440px; height: 210px; }
  .wtilt { display: flex; align-items: center; justify-content: center; }
  .wpop { opacity: 0; }
  .fw { display: block; font-size: 165px; white-space: nowrap; line-height: 1; }
  #w1 .fw, #w3 .fw { color: var(--cream); }
  #w2 .fw { color: var(--gold-light); }
</style>
</head>
<body>
<div id="root" data-composition-id="flap_prompt" data-start="0" data-width="1920" data-height="1080" data-duration="9">

  <div id="fx"></div>

  <!-- PART 1 -->
  <div id="prompt">
    <div id="pExit"><div id="pFloat"><div id="pPop">
      <div id="wings" data-layout-allow-overflow>
        <div class="wing" id="wingL"></div>
        <div class="wing" id="wingR"></div>
        <div id="bloom"></div>
      </div>
      <div id="card" class="panel">
        <span class="ln l1">Can you</span>
        <span class="l2w"><span id="flapWord" class="l2">flap</span></span>
        <span class="ln l3">your arms?</span>
      </div>
    </div></div></div>
  </div>

  <!-- PART 2 -->
  <div id="fader">
    <div id="fx2" class="layer"></div>
    <div id="w1" class="wpos" style="left:1372px; top:230px;">
      <div class="wfloat" id="w1f"><div class="wwig" id="w1w"><div class="wpop" id="w1p"><div class="wtilt" style="transform: rotate(-5deg);"><span class="fw display">Flap!</span></div></div></div></div>
    </div>
    <div id="w2" class="wpos" style="left:120px; top:742px;">
      <div class="wfloat" id="w2f"><div class="wwig" id="w2w"><div class="wpop" id="w2p"><div class="wtilt" style="transform: rotate(4deg);"><span class="fw display">Flap!</span></div></div></div></div>
    </div>
    <div id="w3" class="wpos" style="left:1372px; top:722px;">
      <div class="wfloat" id="w3f"><div class="wwig" id="w3w"><div class="wpop" id="w3p"><div class="wtilt" style="transform: rotate(-3deg);"><span class="fw display">Flap!</span></div></div></div></div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused: true });

  /* ---------- cues (seconds, relative to the overlay start; from timing.json) ---------- */
  const CUE = { prompt_in: 0.5, prompt_out: 2.4, f1: 4.4, f2: 4.94, f3: 5.47, hold_until: 7.6, out_end: 8.2 };

  /* ---------- the wings emblem (peacock-feather wings flanking a marigold) ---------- */
  function feather(len, w, fill, ang) {
    const L = len;
    return `<g transform="rotate(${ang})">
      <path d="M0 0 C ${L * .18} ${-w} ${L * .68} ${-w * 1.08} ${L * .97} ${-w * .22} Q ${L * 1.02} 0 ${L * .97} ${w * .22} C ${L * .68} ${w * 1.08} ${L * .18} ${w} 0 0 Z" fill="${fill}" stroke="#F6B21A" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="${L * .7}" cy="0" r="${w * .42}" fill="#FFD866" stroke="#F6B21A" stroke-width="0"/>
      <circle cx="${L * .7}" cy="0" r="${w * .2}" fill="#0F7F7B"/>
    </g>`;
  }
  function wingSVG(mirror) {
    const fs = [
      { a: -50, len: 112, w: 21, c: '#0E7C78' },
      { a: -32, len: 134, w: 23, c: '#12908C' },
      { a: -14, len: 150, w: 24, c: '#1AA6A0' },
      { a: 5,   len: 130, w: 22, c: '#2DBFB7' },
    ];
    const sx = mirror ? -1 : 1;
    return `<svg viewBox="0 0 380 170"><g transform="translate(${190 + sx * 12} 146) scale(${sx} 1)">${fs.map(f => feather(f.len, f.w, f.c, f.a)).join('')}</g></svg>`;
  }
  document.getElementById('wingR').innerHTML = wingSVG(false);
  document.getElementById('wingL').innerHTML = wingSVG(true);
  document.getElementById('bloom').innerHTML = Kit.svg.marigold(72);

  /* ---------- PART 1: question card ---------- */
  // pop-in exactly on the cue (grows from the bottom centre, soft overshoot)
  tl.fromTo('#pPop', { scale: 0.3, opacity: 0, transformOrigin: '50% 100%' },
                     { scale: 1, opacity: 1, duration: 0.62, ease: 'back.out(1.7)' }, CUE.prompt_in);
  // wings flap gently, three beats, while the question is asked (finite, ends at rest)
  tl.to('#wingR', { rotation: -13, transformOrigin: '202px 146px', duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0.85);
  tl.to('#wingL', { rotation: 13, transformOrigin: '178px 146px', duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0.85);
  // the key word "flap" gives a little squash-and-stretch as it is spoken
  tl.fromTo('#flapWord', { scale: 1, transformOrigin: '50% 60%' }, { scale: 1.1, duration: 0.3, ease: 'sine.out' }, 1.0);
  tl.to('#flapWord', { scale: 1, duration: 0.45, ease: 'sine.inOut' }, 1.3);
  // slow float while it holds
  tl.to('#pFloat', { y: -8, duration: 0.95, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.9);
  // soft sparkles around the emblem as the card lands
  Kit.sparkBurst(tl, '#fx', { x: 1600, y: 386, at: 0.78, n: 7, r: 92, size: 30, seed: 5 });
  // leaves at prompt_out: soft fade with a tiny lift (0.5 s)
  tl.to('#pExit', { opacity: 0, y: -16, scale: 0.95, transformOrigin: '50% 60%', duration: 0.5, ease: 'power1.inOut' }, CUE.prompt_out);

  /* ---------- PART 2: three Flap! words ---------- */
  // hinge side (the edge nearest the rider), wiggle direction, where the little sparkle burst goes
  const W = [
    { id: 'w1', at: CUE.f1, hinge: '8% 62%',  dir: -1, spark: [1716, 262], seed: 21 },
    { id: 'w2', at: CUE.f2, hinge: '92% 62%', dir:  1, spark: [566, 786],  seed: 33 },
    { id: 'w3', at: CUE.f3, hinge: '8% 62%',  dir: -1, spark: [1716, 758], seed: 45 },
  ];
  W.forEach((w, i) => {
    const p = '#' + w.id + 'p', wg = '#' + w.id + 'w', fl = '#' + w.id + 'f';
    // pop: scale with a soft overshoot, opacity eases in a touch quicker
    tl.fromTo(p, { scale: 0.3, opacity: 0, transformOrigin: w.hinge }, { scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, w.at);
    tl.to(p, { opacity: 1, duration: 0.3, ease: 'power1.out' }, w.at);
    // wing-like wiggle about the hinge, settling to rest
    const d = w.dir;
    tl.fromTo(wg, { rotation: d * 16, transformOrigin: w.hinge }, { rotation: -d * 9, duration: 0.2, ease: 'sine.inOut' }, w.at);
    tl.to(wg, { rotation: d * 6, duration: 0.2, ease: 'sine.inOut' }, w.at + 0.2);
    tl.to(wg, { rotation: -d * 3.5, duration: 0.22, ease: 'sine.inOut' }, w.at + 0.4);
    tl.to(wg, { rotation: 0, duration: 0.3, ease: 'sine.inOut' }, w.at + 0.62);
    // idle: a slow flap-like bob until the hold ends (finite)
    const t0 = w.at + 0.95, cyc = 1.0, n = Math.max(1, Math.floor((CUE.hold_until - t0) / cyc));
    tl.fromTo(fl, { y: 0 }, { y: -10, duration: cyc, ease: 'sine.inOut', yoyo: true, repeat: n }, t0);
    // sparkles at the outer corner as the word lands
    Kit.sparkBurst(tl, '#fx', { x: w.spark[0], y: w.spark[1], at: w.at + 0.12, n: 6, r: 66, size: 28, seed: w.seed });
  });
  // slow twinkles while the words hold (each eases in and out over ~1.5 s, never strobes; they live inside #fader so they leave with the words)
  const TW = [
    { x: 1630, y: 188, s: 36, at: 5.9 }, { x: 1776, y: 468, s: 30, at: 6.3 },
    { x: 170,  y: 726, s: 34, at: 6.1 }, { x: 612,  y: 880, s: 30, at: 6.5 },
    { x: 1776, y: 712, s: 32, at: 6.2 }, { x: 1590, y: 714, s: 28, at: 6.6 },
  ];
  const fx2 = document.getElementById('fx2');
  TW.forEach((t, i) => {
    const d = document.createElement('div');
    d.id = 'twk' + i;
    d.style.cssText = `position:absolute;opacity:0;left:${t.x - t.s / 2}px;top:${t.y - t.s / 2}px;width:${t.s}px;height:${t.s}px`;
    d.innerHTML = Kit.svg.sparkle(i % 2 ? '#FFF3DC' : '#FFD866', t.s);
    fx2.appendChild(d);
    tl.fromTo(d, { opacity: 0, scale: 0.35, rotation: 0 }, { opacity: 0.95, scale: 1, rotation: 45, duration: 0.75, ease: 'sine.inOut' }, t.at);
    tl.to(d, { opacity: 0, scale: 0.35, rotation: 90, duration: 0.75, ease: 'sine.inOut' }, t.at + 0.75);
  });
  // every word fades together, softly (hold_until -> out_end)
  tl.to('#fader', { opacity: 0, y: -14, duration: CUE.out_end - CUE.hold_until, ease: 'power1.inOut' }, CUE.hold_until);

  window.__timelines['flap_prompt'] = tl;
</script>
</body>
</html>
