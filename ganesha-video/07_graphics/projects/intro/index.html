<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Mooshak Intro</title>
<script src="vendor/gsap.min.js"></script>
<link rel="stylesheet" href="kit.css" />
<script src="kit.js"></script>
<style>
  /* ---------- canvas ---------- */
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F6A92E; }
  #stage { position: absolute; inset: 0; }

  /* ---------- warm sunrise background ---------- */
  #bg {
    position: absolute; inset: -40px;
    background: linear-gradient(168deg, #F58F2A 0%, #F6A52C 38%, #F8BB34 72%, #FAC94A 100%);
  }
  #glow {
    position: absolute; inset: -400px; transform-origin: 1360px 870px;
    background: radial-gradient(circle 950px at 1360px 870px, rgba(255,244,196,0.98) 0%, rgba(255,232,150,0.78) 20%, rgba(255,214,110,0.38) 42%, rgba(255,200,90,0) 68%);
  }
  #rays {
    position: absolute; inset: 0; --ra: -4deg;
    background: repeating-conic-gradient(from var(--ra) at 960px 470px, rgba(255,246,206,0) 0deg, rgba(255,246,206,0.20) 7.5deg, rgba(255,246,206,0) 15deg);
    -webkit-mask-image: radial-gradient(circle 1400px at 960px 470px, #000 0%, rgba(0,0,0,0.85) 22%, rgba(0,0,0,0) 62%);
            mask-image: radial-gradient(circle 1400px at 960px 470px, #000 0%, rgba(0,0,0,0.85) 22%, rgba(0,0,0,0) 62%);
  }
  .disc { position: absolute; border-radius: 50%; }
  #halo1 { left: 460px; top: -40px; width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(255,246,214,0.62) 0%, rgba(255,240,190,0.46) 62%, rgba(255,236,170,0.0) 100%); }
  #halo2 { left: 300px; top: -200px; width: 1320px; height: 1320px; background: radial-gradient(circle, rgba(255,243,200,0) 54%, rgba(255,243,200,0.26) 70%, rgba(255,243,200,0) 100%); }
  #dawn {
    position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(ellipse at 50% 46%, rgba(255,247,222,0.92) 0%, rgba(255,240,196,0.62) 46%, rgba(255,232,168,0.34) 100%);
  }

  /* ---------- drifting petals and marigolds ---------- */
  .drift { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .pt svg, .fl svg { display: block; overflow: visible; }
  .pt { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform; }
  .pt > div { filter: drop-shadow(0 5px 6px rgba(120,40,12,0.28)); }
  .pt.far > div { filter: blur(2.2px); }

  /* ---------- bell sparkle ---------- */
  #bell { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .ring { position: absolute; width: 640px; height: 640px; box-sizing: border-box; border-radius: 50%; border: 14px solid rgba(255,246,214,0.85); opacity: 0; }
  #starGlow { position: absolute; left: 700px; top: 160px; width: 520px; height: 520px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle, rgba(255,250,228,1) 0%, rgba(255,240,190,0.75) 30%, rgba(255,230,150,0) 70%); }
  #star { position: absolute; left: 820px; top: 280px; width: 280px; height: 280px; opacity: 0; }
  #star svg { display: block; width: 280px; height: 280px; filter: drop-shadow(0 0 14px rgba(255,236,170,0.95)); }

  /* ---------- Mooshak (peeks over the banner) ---------- */
  #moo-clip { position: absolute; left: 0; top: 0; width: 1920px; height: 700px; overflow: hidden; }
  #moo { position: absolute; left: 727px; top: 103px; width: 527px; height: 607px; transform-origin: 233px 532px; }
  #moo img { position: absolute; display: block; }
  #moo-body { left: 0; top: 0; width: 527px; height: 607px; filter: drop-shadow(0 10px 14px rgba(110,30,10,0.28)); }
  #moo-tail {
    left: 353px; top: 420px; width: 174px; height: 161px;
    --a: 360deg;
    -webkit-mask-image: conic-gradient(from 180deg at 117px 46px, transparent 0deg, transparent calc(var(--a) - 6deg), #000 var(--a), #000 360deg);
            mask-image: conic-gradient(from 180deg at 117px 46px, transparent 0deg, transparent calc(var(--a) - 6deg), #000 var(--a), #000 360deg);
  }
  #moo-tailwrap { position: absolute; left: 0; top: 0; width: 527px; height: 607px; transform-origin: 389px 562px; }
  #moo-tailwrap > img { position: absolute; }

  /* ---------- banner ---------- */
  #banner {
    position: absolute; left: 180px; top: 640px; width: 1560px; height: 280px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; gap: 36px;
    box-shadow: 0 -8px 26px rgba(110,28,12,0.30), 0 14px 0 rgba(110,22,15,0.55), 0 26px 44px var(--shadow);
    transform-origin: 50% 50%;
  }
  #banner .gloss { position: absolute; left: 36px; right: 36px; top: 10px; height: 84px; border-radius: 40px 40px 60px 60px;
    background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0)); }
  #banner .clipbox { position: absolute; inset: 0; border-radius: 48px; overflow: hidden; }
  #shine { position: absolute; top: -40px; left: -300px; width: 220px; height: 400px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,246,214,0) 0%, rgba(255,246,214,0.34) 50%, rgba(255,246,214,0) 100%); }
  .word { position: relative; display: block; font-size: 140px; white-space: nowrap; opacity: 0; }

  /* ---------- banner flowers ---------- */
  .fl { position: absolute; opacity: 0; }
  .fl .flr { position: absolute; left: 0; top: 0; filter: drop-shadow(0 6px 7px rgba(110,28,12,0.34)); }
  .fl .leaf { position: absolute; filter: drop-shadow(0 4px 4px rgba(60,80,20,0.25)); }
</style>
</head>
<body>
<div id="root" data-composition-id="intro" data-start="0" data-width="1920" data-height="1080" data-duration="6.5">
  <div id="stage">
    <div id="bg" data-layout-allow-overflow></div>
    <div id="rays"></div>
    <div id="glow" data-layout-allow-overflow></div>
    <div id="halo2" class="disc" data-layout-allow-overflow></div>
    <div id="halo1" class="disc" data-layout-allow-overflow></div>
    <div id="dawn"></div>
    <div id="petals-back" class="drift"></div>

    <div id="bell">
      <div id="ring1" class="ring" data-layout-allow-overflow style="left:640px; top:100px;"></div>
      <div id="ring2" class="ring" data-layout-allow-overflow style="left:640px; top:100px;"></div>
      <div id="starGlow"></div>
      <div id="star"></div>
    </div>

    <div id="moo-clip">
      <div id="moo" data-layout-allow-overflow>
        <div id="moo-tailwrap"><img id="moo-tail" src="img/mooshak_tail.png" alt="" /></div>
        <img id="moo-body" src="img/mooshak_body.png" alt="" />
      </div>
    </div>

    <div id="banner" class="panel">
      <div class="clipbox"><div id="shine" data-layout-allow-overflow></div></div>
      <div class="gloss"></div>
      <div id="w1" class="word display">Mooshak's</div>
      <div id="w2" class="word display">Story</div>
      <div id="w3" class="word display">Time</div>
    </div>

    <div id="fl-tl" class="fl" style="left:115px; top:565px; width:150px; height:150px;"></div>
    <div id="fl-tr" class="fl" style="left:1655px; top:565px; width:150px; height:150px;"></div>
    <div id="fl-bl" class="fl" style="left:128px; top:870px; width:104px; height:104px;"></div>
    <div id="fl-br" class="fl" style="left:1688px; top:870px; width:104px; height:104px;"></div>

  </div>
</div>

<script>
  const W = 1920, H = 1080;
  const tl = gsap.timeline({ paused: true });

  /* ---------- helpers local to this composition ---------- */
  // Petals / marigolds that are already mid-flight at t=0 (no empty first frame), seeded and finite.
  function drift(container, o) {
    const rnd = Kit.rng(o.seed);
    const el = document.querySelector(container);
    for (let i = 0; i < o.n; i++) {
      const outer = document.createElement('div');
      outer.className = 'pt' + (rnd() < (o.far || 0) ? ' far' : '');
      outer.setAttribute('data-layout-allow-overflow', '');
      const inner = document.createElement('div');
      const size = o.minSize + rnd() * (o.maxSize - o.minSize);
      const isFlower = rnd() < o.flowers;
      inner.innerHTML = isFlower
        ? Kit.svg.marigold(size * 1.15, o.fc1 || '#FFD866', o.fc2 || '#EE7F1E')
        : Kit.svg.petal(o.colors[Math.floor(rnd() * o.colors.length)], size * 0.62, size);
      outer.appendChild(inner); el.appendChild(outer);
      const late = rnd() < o.late;
      const d = o.minDur + rnd() * (o.maxDur - o.minDur);
      const t0 = late ? 0.4 + rnd() * 3.2 : 0;
      const u0 = late ? 0 : rnd() * 0.8;
      const x0 = o.xmin + rnd() * (o.xmax - o.xmin), dx = (rnd() - 0.5) * 320;
      const spin = (rnd() - 0.5) * 520, r0 = rnd() * 360;
      const y0 = -100, y1 = H + 100;
      tl.fromTo(outer,
        { x: x0 + dx * u0, y: y0 + (y1 - y0) * u0, rotation: r0 + spin * u0 },
        { x: x0 + dx, y: y1, rotation: r0 + spin, duration: d * (1 - u0), ease: 'none' }, t0);
      const a = o.alpha * (0.8 + rnd() * 0.2);
      if (late) tl.to(outer, { opacity: a, duration: 0.6, ease: 'none' }, t0);
      else tl.set(outer, { opacity: a }, 0);
      const sw = 14 + rnd() * 30, per = 1.8 + rnd() * 1.6;
      const reps = Math.max(1, Math.floor(d * (1 - u0) / (per / 2)) - 1);
      tl.fromTo(inner, { x: -sw, rotationY: -40 }, { x: sw, rotationY: 40, duration: per / 2, ease: 'sine.inOut', yoyo: true, repeat: reps }, t0);
    }
  }

  // leaf drawn already rotated (plain path, no SVG transform) so nothing "spins" off-centre
  const leafSvg = (px, ang) => {
    const r = ang * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    const P = (x, y) => `${(x * c - y * s).toFixed(2)} ${(x * s + y * c).toFixed(2)}`;
    const body = `M${P(0, -20)} C${P(19, -40)} ${P(19, -66)} ${P(0, -84)} C${P(-19, -66)} ${P(-19, -40)} ${P(0, -20)}Z`;
    const half = `M${P(0, -20)} C${P(8, -40)} ${P(9, -64)} ${P(0, -84)} C${P(14, -66)} ${P(13, -40)} ${P(0, -20)}Z`;
    const vein = `M${P(0, -32)} L${P(0, -70)}`;
    return `<svg viewBox="-100 -100 200 200" width="${px}" height="${px}"><path d="${body}" fill="#7DBE62"/><path d="${half}" fill="#6AAA52"/><path d="${vein}" stroke="rgba(255,255,255,0.42)" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`;
  };
  function buildFlower(id, size, leafA, leafB) {
    const host = document.getElementById(id);
    [leafA, leafB].forEach((ang) => {      // leaves sit behind the blossom and poke out in two directions
      const l = document.createElement('div');
      l.className = 'leaf';
      l.setAttribute('data-layout-allow-overflow', '');
      l.style.cssText = `left:${-size / 2}px;top:${-size / 2}px;width:${size * 2}px;height:${size * 2}px`;
      l.innerHTML = leafSvg(size * 2, ang);
      host.appendChild(l);
    });
    const f = document.createElement('div');
    f.className = 'flr';
    f.id = id + '-bloom';
    f.style.cssText = `width:${size}px;height:${size}px`;
    f.innerHTML = Kit.svg.marigold(size, '#FFCB3C', '#EE7F1E');
    host.appendChild(f);
  }
  buildFlower('fl-tl', 150, -62, -118);
  buildFlower('fl-tr', 150, 62, 118);
  buildFlower('fl-bl', 104, -70, 200);
  buildFlower('fl-br', 104, 70, 160);

  /* ---------- static start states ---------- */
  document.getElementById('star').innerHTML = Kit.svg.sparkle('#FFF8E4', 280);

  /* =========================================================
     TIMELINE (seconds from the start of the intro)
       0.00  sunrise background, rays, petals already drifting
       0.90  BELL sparkle (audio chime)
       1.00  banner pops (audio flute)
       1.25  words pop one by one
       1.45  Mooshak rises over the banner
       2.00  tail curls in, Mooshak tilts hello
       3.00  finished lockup holds, gentle push-in to 6.5
     ========================================================= */

  /* --- background life --- */
  tl.fromTo('#glow', { opacity: 0.55, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'sine.out' }, 0);
  tl.to('#glow', { scale: 1.06, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 1.4);
  tl.fromTo('#rays', { '--ra': '-4deg', opacity: 0.7 }, { '--ra': '9deg', opacity: 1, duration: 6.5, ease: 'none' }, 0);
  tl.fromTo('#halo1', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: 'power2.out' }, 0.9);
  tl.fromTo('#halo2', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.6, ease: 'power2.out' }, 1.0);
  tl.fromTo('#dawn', { opacity: 0 }, { opacity: 0.6, duration: 1.5, ease: 'sine.inOut' }, 5.0); // brighter, calm end for the crossfade

  /* --- petals / marigolds drifting --- */
  drift('#petals-back', { n: 22, seed: 11, minSize: 38, maxSize: 74, flowers: 0.26, far: 0.35, late: 0.35,
    minDur: 8, maxDur: 12, xmin: 0, xmax: W, alpha: 0.92,
    colors: ['#FFF3DC', '#F4A6B8', '#D63B2F', '#FFE9A0', '#FFF3DC', '#E85F4A'] });

  /* --- 0.90 bell sparkle: one soft star + ring ripples --- */
  tl.fromTo('#star', { opacity: 0, scale: 0.25, rotation: -35, transformOrigin: '50% 50%' },
                     { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: 'back.out(1.7)' }, 0.9);
  tl.to('#star', { scale: 1.14, rotation: 14, duration: 1.1, ease: 'sine.inOut' }, 1.5);
  tl.to('#star', { opacity: 0, duration: 0.7, ease: 'power1.inOut' }, 1.5);
  tl.fromTo('#starGlow', { opacity: 0, scale: 0.35, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' }, 0.9);
  tl.to('#starGlow', { opacity: 0, scale: 1.25, duration: 1.0, ease: 'power1.inOut' }, 1.4);
  [['#ring1', 0.9], ['#ring2', 1.16]].forEach(([id, at]) => {
    tl.fromTo(id, { scale: 0.3, opacity: 0, transformOrigin: '50% 50%' }, { scale: 2.1, duration: 1.7, ease: 'power2.out' }, at);
    tl.fromTo(id, { opacity: 0 }, { opacity: 0.55, duration: 0.3, ease: 'power1.out' }, at);
    tl.to(id, { opacity: 0, duration: 1.2, ease: 'power1.inOut' }, at + 0.3);
  });

  /* --- 1.00 banner pops open (flute) --- */
  tl.fromTo('#banner', { scaleX: 0.35, scaleY: 0.1, opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power1.out' }, 1.0);
  tl.to('#banner', { scaleX: 1, duration: 0.55, ease: 'power3.out' }, 1.0);
  tl.to('#banner', { scaleY: 1, duration: 0.7, ease: 'back.out(1.7)' }, 1.0);

  // marigold end flowers pop, then slowly turn
  [['#fl-tl', 1.2, 0], ['#fl-tr', 1.28, 0], ['#fl-bl', 1.36, 0], ['#fl-br', 1.44, 0]].forEach(([id, at]) => {
    tl.fromTo(id, { scale: 0.15, opacity: 0, rotation: -40, transformOrigin: '50% 50%' },
                  { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: 'back.out(1.8)' }, at);
  });
  ['#fl-tl-bloom', '#fl-tr-bloom', '#fl-bl-bloom', '#fl-br-bloom'].forEach((id, i) => {
    tl.to(id, { scale: 1.045, transformOrigin: '50% 50%', duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 1.9 + i * 0.17);
  });

  // words pop one by one
  [['#w1', 1.25], ['#w2', 1.5], ['#w3', 1.72]].forEach(([id, at]) => {
    tl.fromTo(id, { opacity: 0, y: 46, scale: 0.55, transformOrigin: '50% 80%' },
                  { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(2.1)' }, at);
  });
  // soft shine sweeps over the banner once the name has landed
  tl.fromTo('#shine', { x: 0, rotation: 14 }, { x: 1900, duration: 1.1, ease: 'sine.inOut' }, 2.35);
  tl.to('#shine', { opacity: 1, duration: 0.3, ease: 'none' }, 2.35);
  tl.to('#shine', { opacity: 0, duration: 0.3, ease: 'none' }, 3.15);

  /* --- 1.45 Mooshak rises over the banner --- */
  tl.fromTo('#moo', { y: 610, scaleX: 1.04, scaleY: 0.94 }, { y: -30, scaleX: 0.97, scaleY: 1.05, duration: 0.55, ease: 'power3.out' }, 1.45);
  tl.to('#moo', { y: 0, scaleX: 1.04, scaleY: 0.95, duration: 0.25, ease: 'sine.inOut' }, 2.0);   // settle / squash
  tl.to('#moo', { scaleX: 1, scaleY: 1, duration: 0.3, ease: 'sine.out' }, 2.25);
  // little hello tilt (pivot hidden behind the banner)
  tl.to('#moo', { rotation: -5, duration: 0.32, ease: 'sine.inOut' }, 2.45);
  tl.to('#moo', { rotation: 5, duration: 0.42, ease: 'sine.inOut' }, 2.77);
  tl.to('#moo', { rotation: -2.5, duration: 0.34, ease: 'sine.inOut' }, 3.19);
  tl.to('#moo', { rotation: 0, duration: 0.4, ease: 'sine.inOut' }, 3.53);

  /* --- tail curls in (conic reveal around the loop) + a flick --- */
  tl.fromTo('#moo-tail', { '--a': '360deg' }, { '--a': '0deg', duration: 0.95, ease: 'power2.inOut' }, 1.95);
  tl.to('#moo-tailwrap', { rotation: -9, duration: 0.3, ease: 'sine.inOut' }, 2.85);
  tl.to('#moo-tailwrap', { rotation: 6, duration: 0.4, ease: 'sine.inOut' }, 3.15);
  tl.to('#moo-tailwrap', { rotation: 0, duration: 0.4, ease: 'sine.inOut' }, 3.55);

  /* --- idle breathing + tail sway while the lockup holds (finite) --- */
  tl.to('#moo', { scaleY: 1.014, scaleX: 0.994, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 3.9);
  tl.to('#moo-tailwrap', { rotation: 3.5, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 4.0);
  tl.to('#moo', { rotation: 0, duration: 0.01 }, 6.4);

  /* --- very gentle push-in on the finished lockup --- */
  tl.fromTo('#stage', { scale: 1, transformOrigin: '960px 520px' }, { scale: 1.035, duration: 3.5, ease: 'sine.inOut' }, 3.0);

  window.__timelines['intro'] = tl;
</script>
</body>
</html>
